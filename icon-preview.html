<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>挖个爽 · 文物图标预览</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #1a0f0a;
  color: #d4a574;
  font-family: 'Microsoft YaHei', sans-serif;
  padding: 24px;
}
h1 {
  text-align: center;
  font-size: 28px;
  color: #f4d03f;
  margin-bottom: 8px;
  letter-spacing: 4px;
}
.subtitle {
  text-align: center;
  font-size: 13px;
  color: #8b7355;
  margin-bottom: 32px;
}
.priority-section {
  margin-bottom: 36px;
}
.priority-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid #3d2817;
  display: flex;
  align-items: center;
  gap: 10px;
}
.priority-badge {
  font-size: 12px;
  padding: 2px 10px;
  border-radius: 10px;
  color: #1a0f0a;
}
.badge-p0 { background: #f4d03f; }
.badge-p1 { background: #e67e22; }
.badge-p2 { background: #3498db; }
.badge-p3 { background: #888; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}
.card {
  background: #2c1810;
  border-radius: 12px;
  padding: 16px;
  text-align: center;
  border: 2px solid #3d2817;
  transition: border-color .2s, transform .15s;
}
.card:hover {
  border-color: #d4a574;
  transform: translateY(-2px);
}
.card .img-wrap {
  width: 128px; height: 128px;
  margin: 0 auto 12px;
  background: #1a0f0a;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.card .img-wrap img {
  max-width: 100%; max-height: 100%;
  object-fit: contain;
  image-rendering: auto;
}
.card .type-name {
  font-size: 16px;
  font-weight: bold;
  color: #f4d03f;
  margin-bottom: 4px;
}
.card .filename {
  font-size: 11px;
  color: #8b7355;
  font-family: monospace;
  margin-bottom: 6px;
}
.card .artifacts {
  font-size: 11px;
  color: #9b8b6f;
  line-height: 1.5;
}
.card .count {
  font-size: 11px;
  color: #5a4030;
  margin-top: 4px;
}
.footer {
  text-align: center;
  font-size: 12px;
  color: #5a4030;
  margin-top: 40px;
  padding-top: 16px;
  border-top: 1px solid #3d2817;
}
</style>
</head>
<body>

<h1>🏺 挖个爽 · 文物图标预览</h1>
<p class="subtitle">20 种类型图标 · 覆盖全部 61 件文物 · 半写实古风手绘</p>

<div class="priority-section">
  <div class="priority-title"><span class="priority-badge badge-p0">P0</span> 必做 — 高频出现</div>
  <div class="grid" id="grid-p0"></div>
</div>

<div class="priority-section">
  <div class="priority-title"><span class="priority-badge badge-p1">P1</span> 重要 — 数量多或视觉突出</div>
  <div class="grid" id="grid-p1"></div>
</div>

<div class="priority-section">
  <div class="priority-title"><span class="priority-badge badge-p2">P2</span> 数量少但独特</div>
  <div class="grid" id="grid-p2"></div>
</div>

<div class="priority-section">
  <div class="priority-title"><span class="priority-badge badge-p3">P3</span> 彩蛋级</div>
  <div class="grid" id="grid-p3"></div>
</div>

<p class="footer">图标尺寸 1024×1024 · 游戏中缩放至 256×256 · 确认后即可集成</p>

<script>
const icons = [
  // P0 - 必做
  { file:'pottery.png',     name:'陶器',   priority:'p0',
    artifacts:'人面鱼纹彩陶盆 · 鹳鱼石斧图陶缸 · 彩陶残片 · 小口尖底瓶 · 波浪纹陶罐 · 印纹硬陶罐', count:6 },
  { file:'jade.png',        name:'玉器',   priority:'p0',
    artifacts:'玉琮 · 神人兽面纹玉琮 · 玉璜 · 玉龙 · 和田青白玉玺', count:5 },
  { file:'jade_bi.png',     name:'玉璧',   priority:'p0',
    artifacts:'玉璧 · 龙纹玉璧', count:2 },
  { file:'bronze.png',      name:'青铜器', priority:'p0',
    artifacts:'后母戊鼎 · 青铜尊 · 青铜戈 · 青铜斝 · 饕餮纹方鼎 · 日光铜镜 · 秦半两钱 · 封泥印章 · 海兽葡萄镜 · 交子印版 · 指南鱼 · 开元通宝 · 洪武通宝', count:13 },
  { file:'porcelain.png',   name:'瓷器',   priority:'p0',
    artifacts:'汝窑天青釉盘 · 官窑粉青贯耳瓶 · 哥窑冰裂纹洗 · 元青花罐 · 钧窑花盆 · 定窑刻花碗 · 永乐青花压手杯 · 成化斗彩鸡缸杯', count:8 },
  { file:'gold.png',        name:'金银器', priority:'p0',
    artifacts:'鎏金舞马衔杯银壶 · 鸳鸯莲瓣纹金碗 · 金凤钗', count:3 },
  { file:'stone.png',       name:'石器',   priority:'p0',
    artifacts:'石刀 · 石磨盘', count:2 },
  // P1 - 重要
  { file:'terracotta.png',  name:'陶俑',   priority:'p1',
    artifacts:'兵马俑将军俑 · 陶马俑', count:2 },
  { file:'silk.png',        name:'丝织品', priority:'p1',
    artifacts:'马王堆帛画 · 敦煌飞天壁画残片 · 联珠对兽纹锦 · 苏绣双面猫蝶图', count:4 },
  { file:'ceramic.png',     name:'唐三彩', priority:'p1',
    artifacts:'载乐骆驼俑 · 三彩马 · 供春紫砂壶', count:3 },
  { file:'lacquer.png',     name:'漆器',   priority:'p1',
    artifacts:'彩绘漆奁', count:1 },
  { file:'painting.png',    name:'书画',   priority:'p1',
    artifacts:'溪山行旅图残卷 · 文徵明书画折扇', count:2 },
  // P2 - 少但独特
  { file:'bone.png',        name:'骨器',   priority:'p2',
    artifacts:'骨针', count:1 },
  { file:'oracle_bone.png', name:'甲骨',   priority:'p2',
    artifacts:'甲骨文', count:1 },
  { file:'enamel.png',      name:'珐琅器', priority:'p2',
    artifacts:'珐琅彩百花不露地瓶 · 套料雕花鼻烟壶', count:2 },
  { file:'cloisonne.png',   name:'景泰蓝', priority:'p2',
    artifacts:'景泰蓝龙纹大瓶', count:1 },
  { file:'bamboo.png',      name:'竹简',   priority:'p2',
    artifacts:'睡虎地秦简', count:1 },
  { file:'bronze_chariot.png', name:'铜车马', priority:'p2',
    artifacts:'铜车马', count:1 },
  // P3 - 彩蛋
  { file:'jade_suit.png',   name:'金缕玉衣', priority:'p3',
    artifacts:'金缕玉衣', count:1 },
  { file:'silver.png',      name:'银器',   priority:'p3',
    artifacts:'银鎏金高足杯', count:1 },
];

icons.forEach(icon => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="img-wrap"><img src="assets/artifacts/${icon.file}" alt="${icon.name}" loading="lazy"></div>
    <div class="type-name">${icon.name}</div>
    <div class="filename">${icon.file}</div>
    <div class="artifacts">${icon.artifacts}</div>
    <div class="count">覆盖 ${icon.count} 件文物</div>
  `;
  const gridId = 'grid-' + icon.priority;
  document.getElementById(gridId).appendChild(card);
});
</script>

</body>
</html>
