<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>挖个爽 - 文化考古游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #2c1810 0%, #1a0f0a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'KaiTi', 'STKaiti', 'Microsoft YaHei', serif;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            max-height: 800px;
            position: relative;
        }

        #game-canvas {
            /* Phaser Scale Manager 自己管理 canvas 尺寸，不在此处覆盖 */
        }

        #game-canvas canvas {
            display: block;
            margin: 0 auto;
        }

        /* 加载画面 */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2c1810 0%, #1a0f0a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading-screen h1 {
            color: #d4a574;
            font-size: 72px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
        }

        #loading-screen .subtitle {
            color: #8b7355;
            font-size: 18px;
            margin-bottom: 40px;
        }

        .progress-bar {
            width: 300px;
            height: 8px;
            background: #3d2817;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #d4a574, #f4d03f);
            transition: width 0.3s ease;
        }

        #loading-text {
            color: #a08060;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading-screen">
            <h1>挖个爽</h1>
            <p class="subtitle">Dig It Up!</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <p id="loading-text">正在初始化...</p>
        </div>
        <div id="game-canvas"></div>
    </div>

    <!-- Phaser 3 游戏引擎 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>

    <!-- 安全体系 (IOA + HaS-Anonymizer) -->
    <script src="src/security/DataValidator.js"></script>
    <script src="src/security/AnomalyDetector.js"></script>
    <script src="src/security/HaSAnonymizer.js"></script>
    <!-- 游戏核心代码 -->
    <script src="src/config/gameConfig.js"></script>
    <script src="src/core/BigNumber.js"></script>
    <script src="src/core/GameState.js"></script>
    <script src="src/core/EconomyManager.js"></script>
    <script src="src/core/SaveManager.js"></script>
    <script src="src/core/PrestigeManager.js"></script>
    <script src="src/core/AudioManager.js"></script>
    <script src="src/tutorial/TutorialUI.js"></script>
    <script src="src/tutorial/TutorialManager.js"></script>
    <script src="src/data/eraData.js"></script>
    <script src="src/data/artifactData.js"></script>
    <script src="src/scenes/BootScene.js"></script>
    <script src="src/scenes/MainScene.js"></script>
    <script src="src/scenes/ExcavationScene.js"></script>
    <script src="src/scenes/MuseumScene.js"></script>
    <script src="src/scenes/PrestigeScene.js"></script>
    <script src="src/scenes/RepairWorkshopScene.js"></script>
    <script src="src/game.js"></script>
</body>
</html>
